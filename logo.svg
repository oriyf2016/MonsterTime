<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="MonsterTime">
  <!-- MonsterTime: a stopwatch with eyes -->

  <!-- Top button and stem -->
  <rect x="94" y="30" width="12" height="18" rx="3" fill="#0f766e" stroke="#0b1220" stroke-width="5"/>
  <rect x="82" y="12" width="36" height="20" rx="7" fill="#5eead4" stroke="#0b1220" stroke-width="5"/>
  <!-- Side button -->
  <rect x="146" y="44" width="22" height="14" rx="5" fill="#5eead4" stroke="#0b1220" stroke-width="5" transform="rotate(45 157 51)"/>

  <!-- Body -->
  <circle cx="100" cy="118" r="72" fill="#14b8a6" stroke="#0b1220" stroke-width="5"/>
  <!-- Face -->
  <circle cx="100" cy="118" r="57" fill="#ecfeff"/>

  <!-- Tick marks (12, 3, 6, 9) -->
  <g stroke="#0f766e" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="67" x2="100" y2="76"/>
    <line x1="151" y1="118" x2="142" y2="118"/>
    <line x1="100" y1="169" x2="100" y2="160"/>
    <line x1="49" y1="118" x2="58" y2="118"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="80" cy="108" rx="11" ry="14" fill="#0b1220"/>
  <ellipse cx="120" cy="108" rx="11" ry="14" fill="#0b1220"/>
  <circle cx="84" cy="102" r="4" fill="#fff"/>
  <circle cx="124" cy="102" r="4" fill="#fff"/>

  <!-- Cheeks -->
  <ellipse cx="67" cy="132" rx="8" ry="5" fill="#f472b6" opacity=".6"/>
  <ellipse cx="133" cy="132" rx="8" ry="5" fill="#f472b6" opacity=".6"/>

  <!-- Smile with a tooth -->
  <path d="M86 136 Q100 148 114 136" stroke="#0b1220" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="96" y="140" width="7" height="6" rx="1.5" fill="#fff"/>
</svg>
